name: Plan and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      analytics_release_approved:
        description: No-writer window and durable quiesced backup are verified for this analytics release
        required: true
        type: boolean
        default: false
      analytics_release_record:
        description: Nonsecret approved analytics release record identifier
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    # Keep command substitutions and diagnostic pipelines fail closed.
    shell: bash

# A checked artifact belongs to one complete release. Never let two runs mix
# candidate archives, plans, website bytes or producer versions.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify reviewed source and artifacts
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  deploy-infrastructure:
    name: Plan and apply checked infrastructure
    needs: verify-release
    runs-on: ubuntu-latest
    environment: AWS General
    permissions:
      contents: read
      id-token: write
    outputs:
      stats_code_change: ${{ steps.stats-code.outputs.changed }}
    env:
      TF_VAR_email_address: ${{ secrets.EMAIL_ADDRESS }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - name: Install release gate dependencies
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::870140981796:role/github-deploy
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Download checked website
        uses: actions/download-artifact@v8
        with:
          name: checked-web
          path: out

      - name: Download checked Lambda archives
        uses: actions/download-artifact@v8
        with:
          name: checked-lambda-archives
          path: release-artifacts

      - name: Download checked website manifest
        uses: actions/download-artifact@v8
        with:
          name: checked-site-manifest
          path: checked-manifest

      - name: Verify and stage exact checked artifacts
        run: |
          python3 scripts/package_release_artifacts.py verify --output-dir release-artifacts
          node scripts/publish_static_site.mjs manifest --artifact-dir out --manifest "$RUNNER_TEMP/site-manifest.json"
          cmp checked-manifest/checked-site-manifest.json "$RUNNER_TEMP/site-manifest.json"
          cp release-artifacts/contact-lambda.zip terraform/lambda_function.zip
          cp release-artifacts/stats-aggregator.zip terraform/stats_aggregator.zip

      - name: Terraform init
        run: terraform -chdir=terraform init -input=false -lockfile=readonly -no-color

      # Terraform plans can contain private input and state values. Keep both
      # binary and JSON forms inside this privileged job; never upload them.
      - name: Create private state-backed plan
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/private-plan"
          if ! terraform -chdir=terraform plan -input=false -lock=false -no-color \
            -out="$RUNNER_TEMP/private-plan/release.tfplan" \
            > "$RUNNER_TEMP/private-plan/plan.log" 2>&1; then
            echo "Terraform plan failed; inspect the privileged deployment job without publishing the private plan."
            exit 1
          fi
          terraform -chdir=terraform show -json "$RUNNER_TEMP/private-plan/release.tfplan" \
            > "$RUNNER_TEMP/private-plan/release.json"

      - name: Identify analytics plan prerequisites
        id: analytics-plan
        run: |
          node scripts/verify_public_stats_reader.mjs \
            --plan "$RUNNER_TEMP/private-plan/release.json" >> "$GITHUB_OUTPUT"

      - name: Compare checked analytics package with deployed code
        id: stats-code
        env:
          FUNCTION_NAME: ${{ vars.STATS_AGGREGATOR_FUNCTION_NAME }}
          REQUIRES_READER: ${{ steps.analytics-plan.outputs.requires_reader }}
        run: |
          if [ "$REQUIRES_READER" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deployed="$(aws lambda get-function --function-name "$FUNCTION_NAME" --query Configuration.CodeSha256 --output text)"
          checked="$(openssl dgst -sha256 -binary release-artifacts/stats-aggregator.zip | openssl base64 -A)"
          if [ "$deployed" = "$checked" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require approved analytics migration boundary
        env:
          EVENT_NAME: ${{ github.event_name }}
          ANALYTICS_PLAN_CHANGE: ${{ steps.analytics-plan.outputs.analytics_change }}
          ANALYTICS_CODE_CHANGE: ${{ steps.stats-code.outputs.changed }}
          ANALYTICS_RELEASE_APPROVED: ${{ inputs.analytics_release_approved }}
          ANALYTICS_RELEASE_RECORD: ${{ inputs.analytics_release_record }}
        run: |
          if [ "$ANALYTICS_PLAN_CHANGE" != "true" ] && [ "$ANALYTICS_CODE_CHANGE" != "true" ]; then
            exit 0
          fi
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$ANALYTICS_RELEASE_APPROVED" != "true" ]; then
            echo "Analytics release blocked: use the reviewed manual release after proving the no-writer window and durable quiesced backup."
            exit 1
          fi
          if ! [[ "$ANALYTICS_RELEASE_RECORD" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$ ]]; then
            echo "Analytics release blocked: provide a nonsecret approved release record identifier."
            exit 1
          fi

      - name: Install browser for producer bootstrap gate
        if: steps.analytics-plan.outputs.requires_reader == 'true'
        run: yarn playwright install --with-deps chromium

      - name: Verify public reader before producer bootstrap
        if: steps.analytics-plan.outputs.requires_reader == 'true'
        run: |
          node scripts/verify_public_stats_reader.mjs --artifact-dir out \
            --origin https://andrewmalvani.com --origin https://www.andrewmalvani.com \
            --report bootstrap-reader-verification.json
        # If unavailable or stale, stop for a separately reviewed reader bootstrap.

      - name: Preserve bootstrap reader evidence
        if: steps.analytics-plan.outputs.requires_reader == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-reader-verification
          path: bootstrap-reader-verification.json
          if-no-files-found: error
          retention-days: 7

      # Upload complete checked static dependencies before 404.html. No key is
      # deleted and stats.json remains owned by the analytics producer.
      - name: Stage checked recovery page before CloudFront error policy
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          node scripts/publish_static_site.mjs upload --artifact-dir out \
            --manifest checked-manifest/checked-site-manifest.json \
            --bucket "$S3_BUCKET_NAME" --phase recovery

      - name: Apply the private checked plan
        run: |
          if ! terraform -chdir=terraform apply -input=false -no-color \
            "$RUNNER_TEMP/private-plan/release.tfplan" \
            > "$RUNNER_TEMP/private-plan/apply.log" 2>&1; then
            echo "Terraform apply failed; the private plan and output were not published."
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/private-plan"

  publish-site:
    name: Publish checked website
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    environment: AWS General
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::870140981796:role/github-deploy
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Download checked website
        uses: actions/download-artifact@v8
        with:
          name: checked-web
          path: out
      - name: Download checked website manifest
        uses: actions/download-artifact@v8
        with:
          name: checked-site-manifest
          path: checked-manifest
      - name: Setup publication runtime
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Publish verified candidate and cache metadata
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          node scripts/publish_static_site.mjs upload --artifact-dir out \
            --manifest checked-manifest/checked-site-manifest.json \
            --bucket "$S3_BUCKET_NAME" --phase all

  invalidate-cloudfront:
    name: Invalidate CloudFront distribution
    needs: publish-site
    runs-on: ubuntu-latest
    environment: AWS General
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::870140981796:role/github-deploy
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Invalidate CloudFront cache
        env:
          CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$CF_DISTRIBUTION_ID" --paths '/*'

  verify-analytics-reader:
    name: Verify public analytics reader
    needs: invalidate-cloudfront
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v6
      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
      - name: Install release gate dependencies
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile
          yarn playwright install --with-deps chromium
      - name: Download checked website
        uses: actions/download-artifact@v8
        with:
          name: checked-web
          path: out
      - name: Verify ordinary public reader responses and behavior
        run: |
          node scripts/verify_public_stats_reader.mjs --artifact-dir out \
            --origin https://andrewmalvani.com --origin https://www.andrewmalvani.com \
            --report public-reader-verification.json
      - name: Preserve reader release evidence
        uses: actions/upload-artifact@v7
        with:
          name: public-reader-verification
          path: public-reader-verification.json
          if-no-files-found: error
          retention-days: 7

  update-contact-code:
    name: Install checked contact package
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    environment: AWS General
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download checked Lambda archives
        uses: actions/download-artifact@v8
        with:
          name: checked-lambda-archives
          path: release-artifacts
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::870140981796:role/github-deploy
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Update contact Lambda with exact checked archive
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code --function-name "$FUNCTION_NAME" \
            --zip-file fileb://release-artifacts/contact-lambda.zip \
            --query '{FunctionName:FunctionName,CodeSha256:CodeSha256,LastModified:LastModified}'

  update-analytics-code:
    name: Install checked analytics package
    needs: [deploy-infrastructure, verify-analytics-reader]
    if: needs.deploy-infrastructure.outputs.stats_code_change == 'true'
    runs-on: ubuntu-latest
    environment: AWS General
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download checked Lambda archives
        uses: actions/download-artifact@v8
        with:
          name: checked-lambda-archives
          path: release-artifacts
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::870140981796:role/github-deploy
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Update analytics Lambda with exact checked archive
        env:
          FUNCTION_NAME: ${{ vars.STATS_AGGREGATOR_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code --function-name "$FUNCTION_NAME" \
            --zip-file fileb://release-artifacts/stats-aggregator.zip \
            --query '{FunctionName:FunctionName,CodeSha256:CodeSha256,LastModified:LastModified}'
