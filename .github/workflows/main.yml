name: Plan and Deploy

on:
  push:
    branches:
      - 'main'

# Required for OIDC: jobs request a short-lived token to assume the AWS role.
permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: 'Terraform plan'
    runs-on: ubuntu-latest
    environment: "AWS General"
    # email_address has no default (kept out of source); supply it via secret.
    # cloudflare_zone_id comes from a repo var; if unset, the stats aggregator
    # simply skips the Cloudflare uniques/countries query.
    env:
      TF_VAR_email_address: ${{ secrets.EMAIL_ADDRESS }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::870140981796:role/github-deploy
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Upload web assets
        uses: actions/upload-artifact@v7
        with:
          name: out
          path: out

      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check

      - name: Terraform Init
        run: terraform -chdir=terraform init -input=false

      - name: Terraform refresh
        run: terraform -chdir=terraform refresh -input=false

      - name: Terraform Plan
        run: terraform -chdir=terraform plan -input=false -out=plan.tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v7
        with:
          name: plan
          path: terraform/plan.tfplan

  terraform-apply:
    name: 'Terraform Apply'
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: "AWS General"
    # email_address has no default (kept out of source); supply it via secret.
    # cloudflare_zone_id comes from a repo var; if unset, the stats aggregator
    # simply skips the Cloudflare uniques/countries query.
    env:
      TF_VAR_email_address: ${{ secrets.EMAIL_ADDRESS }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::870140981796:role/github-deploy
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Terraform Init
        run: terraform -chdir=terraform init -input=false

      - name: Download Plan
        uses: actions/download-artifact@v8
        with:
          name: plan
          path: terraform/plan

      - name: Download candidate website artifact
        uses: actions/download-artifact@v8
        with:
          name: out
          path: candidate-out

      # First creation/replacement embeds producer code in Terraform apply,
      # so it needs public reader proof BEFORE apply, not just code-update.
      - name: Setup Node for bootstrap gate
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install release gate dependencies
        run: yarn install --frozen-lockfile

      - name: Verify candidate manifest and recovery references
        run: |
          node scripts/publish_static_site.mjs manifest --artifact-dir candidate-out \
            --manifest candidate-manifest.json

      - name: Preserve candidate cache manifest
        uses: actions/upload-artifact@v7
        with:
          name: candidate-cache-manifest
          path: candidate-manifest.json
          if-no-files-found: error

      - name: Identify analytics bootstrap prerequisite
        id: analytics-bootstrap
        run: |
          umask 077
          terraform -chdir=terraform show -json plan/plan.tfplan > "$RUNNER_TEMP/analytics-plan.json"
          node scripts/verify_public_stats_reader.mjs --plan "$RUNNER_TEMP/analytics-plan.json" >> "$GITHUB_OUTPUT"
          rm "$RUNNER_TEMP/analytics-plan.json"

      - name: Install browser for bootstrap gate
        if: steps.analytics-bootstrap.outputs.requires_reader == 'true'
        run: yarn playwright install --with-deps chromium

      - name: Verify public reader before producer bootstrap
        if: steps.analytics-bootstrap.outputs.requires_reader == 'true'
        run: |
          node scripts/verify_public_stats_reader.mjs --artifact-dir candidate-out \
            --origin https://andrewmalvani.com --origin https://www.andrewmalvani.com \
            --report bootstrap-reader-verification.json
        # If unavailable/stale, stop: stage the reader in a separate reviewed
        # bootstrap before retrying. Never bypass this by renaming resources.

      - name: Preserve bootstrap reader evidence
        if: steps.analytics-bootstrap.outputs.requires_reader == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-reader-verification
          path: bootstrap-reader-verification.json
          if-no-files-found: error

      # data.archive_file writes these zips at *plan* time (previous job's
      # workspace), but the provider reads them from disk when creating a
      # Lambda at *apply* time — recreate them here so a first-time function
      # create doesn't fail. Code updates still flow through update-lambda-code.
      - name: Prepare Lambda bootstrap zips
        run: |
          (cd sns_publish_lambda && zip ../terraform/lambda_function.zip lambda_function.py)
          (cd stats_aggregator && zip ../terraform/stats_aggregator.zip lambda_function.py payload.py ledger.py)

      # Upload immutable candidate assets first and 404.html last. This makes
      # the recovery page usable before Terraform can enable its error mapping.
      # No objects are deleted and stats.json is not touched.
      - name: Stage checked recovery page before CloudFront error policy
        run: |
          node scripts/publish_static_site.mjs upload --artifact-dir candidate-out \
            --manifest candidate-manifest.json --bucket "$S3_BUCKET_NAME" --phase recovery
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

      - name: Terraform Apply
        run: terraform -chdir=terraform apply "plan/plan.tfplan"

  update-s3-contents:
      name: Update S3 Contents
      needs: terraform-apply
      runs-on: ubuntu-latest
      environment: "AWS General"
      steps:
        - name: Checkout
          uses: actions/checkout@v6

        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v6
          with:
            role-to-assume: arn:aws:iam::870140981796:role/github-deploy
            aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

        - name: Download build artifacts
          uses: actions/download-artifact@v8
          with:
            name: out
            path: out

        - name: Setup publication runtime
          uses: actions/setup-node@v6
          with:
            node-version: '22'

        - name: Download checked candidate cache manifest
          uses: actions/download-artifact@v8
          with:
            name: candidate-cache-manifest
            path: release-manifest

        # Refresh every known candidate key even if its bytes are unchanged.
        # Hashed assets precede stable files; no delete/list operation exists.
        # stats.json belongs to the Lambda and is always excluded by the manifest.
        - name: Publish verified candidate and cache metadata
          run: |
            node scripts/publish_static_site.mjs upload --artifact-dir out \
              --manifest release-manifest/candidate-manifest.json --bucket "$S3_BUCKET_NAME" --phase all
          env:
            S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

  verify-analytics-reader:
      name: Verify Public Analytics Reader
      needs: [update-s3-contents, cloudfront-invalidation]
      runs-on: ubuntu-latest
      permissions:
        contents: read
      steps:
        - name: Checkout
          uses: actions/checkout@v6
        - name: Setup Node
          uses: actions/setup-node@v6
          with:
            node-version: '22'
            cache: 'yarn'
        - name: Install release gate dependencies
          run: yarn install --frozen-lockfile
        - name: Download candidate reader artifact
          uses: actions/download-artifact@v8
          with:
            name: out
            path: out
        - name: Install verification browser
          run: yarn playwright install --with-deps chromium
        - name: Verify ordinary public reader responses and behavior
          run: |
            node scripts/verify_public_stats_reader.mjs --artifact-dir out \
              --origin https://andrewmalvani.com --origin https://www.andrewmalvani.com \
              --report public-reader-verification.json
        - name: Preserve reader release evidence
          uses: actions/upload-artifact@v7
          with:
            name: public-reader-verification
            path: public-reader-verification.json
            if-no-files-found: error

  update-lambda-code:
      name: Update Lambda Code
      # E5 must retain this dependency when reusing checked deployment artifacts.
      needs: verify-analytics-reader
      runs-on: ubuntu-latest
      environment: "AWS General"
      strategy:
        matrix:
          include:
            - dir: sns_publish_lambda
              function_var: LAMBDA_FUNCTION_NAME
              package_files: lambda_function.py
            - dir: stats_aggregator
              function_var: STATS_AGGREGATOR_FUNCTION_NAME
              package_files: lambda_function.py payload.py ledger.py
      steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::870140981796:role/github-deploy
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Zip Lambda Code
        run: |
          cd ${{ matrix.dir }}
          zip ../lambda_code.zip ${{ matrix.package_files }}

      - name: Update Lambda Code
        run: aws lambda update-function-code --function-name $LAMBDA_FUNCTION_NAME --zip-file fileb://lambda_code.zip
        env:
          LAMBDA_FUNCTION_NAME: ${{ vars[matrix.function_var] }}

  cloudfront-invalidation:
      name: Invalidate CloudFront Distribution
      needs: update-s3-contents
      runs-on: ubuntu-latest
      environment: "AWS General"
      steps:
        - name: Checkout
          uses: actions/checkout@v6

        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v6
          with:
            role-to-assume: arn:aws:iam::870140981796:role/github-deploy
            aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

        - name: Invalidate CloudFront cache
          run: |
            aws cloudfront create-invalidation --distribution-id $CF_DISTRIBUTION_ID --paths "/*"
          env:
            CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}
